<title>Sentinel Run Monitor</title>
<style>
  :root{
    --bg:#0a0e13; --panel:#111922; --panel2:#0e151d; --border:#213043;
    --text:#d3dbe6; --dim:#7a8a9d; --faint:#4a5766;
    --cyan:#4fd6be; --sentinel:#c874ff; --amber:#e0b13a;
    --p-coordination:#5b8def; --p-reconnaissance:#39b6a6; --p-credential_theft:#e0a63a;
    --p-sandbox_escape:#e07b3a; --p-lateral_movement:#e05a7a; --p-exfiltration:#e0483a;
    --p-evasion:#9a6bff;
    --c-none:#6b7684; --c-forming:#e0c04a; --c-active:#46c46a;
    --good:#46c46a; --bad:#e0555a;
    --mono:"SFMono-Regular",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);
    padding-block:18px;padding-inline:max(16px,3vw);line-height:1.45}
  h1{font-size:15px;font-weight:600;letter-spacing:.3px;margin:0}
  .sub{color:var(--dim);font-size:12px}
  .wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
  header{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px}
  .run{font-family:var(--mono);color:var(--dim);font-size:12px}
  .status{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
  .tile{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 12px;min-width:118px}
  .tile .k{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--faint)}
  .tile .v{font-family:var(--mono);font-size:14px;margin-top:3px;font-weight:600}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:20px;
    font-family:var(--mono);font-size:12px;font-weight:600;border:1px solid transparent}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .agents{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media(min-width:900px){.agents{grid-template-columns:repeat(3,1fr)}
    .agent.sentinel{grid-column:3;grid-row:1/3}}
  .agent{background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:11px 12px;display:flex;flex-direction:column;gap:7px;min-height:132px}
  .agent.sentinel{border-color:#3a2a52;background:linear-gradient(180deg,#160f22,#0e151d)}
  .agent.acting{border-color:var(--cyan)}
  .agent.sentinel.acting{border-color:var(--sentinel)}
  .ahead{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .aid{font-family:var(--mono);font-weight:700;font-size:14px}
  .sentinel .aid{color:var(--sentinel)}
  .arole{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.6px}
  .cmd{font-family:var(--mono);font-size:12px;background:var(--panel2);border:1px solid var(--border);
    border-radius:6px;padding:6px 8px;white-space:pre-wrap;word-break:break-word;overflow:hidden}
  .cmd .p{color:var(--cyan)}
  .out{font-family:var(--mono);font-size:11px;color:var(--dim);white-space:pre-wrap;
    word-break:break-word;max-height:52px;overflow:hidden}
  .think{font-size:11.5px;color:var(--dim);font-style:italic;border-left:2px solid var(--faint);padding-left:8px}
  .idle{color:var(--faint);font-family:var(--mono);font-size:12px}
  .report{font-family:var(--mono);font-size:12px;font-weight:600}
  .board{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:11px 12px}
  .board h2{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--faint);margin:0 0 8px}
  .entries{display:flex;flex-wrap:wrap;gap:7px}
  .entry{font-family:var(--mono);font-size:11.5px;padding:4px 9px;border-radius:6px;
    background:var(--panel2);border:1px solid var(--border);color:var(--dim)}
  .entry.seed{border-color:#4a3a1a;color:var(--amber)}
  .entry.sentinelpost{border-color:#3a2a52;color:var(--sentinel)}
  .entry.residentpost{border-color:#1a3a2a;color:var(--good)}
  .entry.fresh{animation:pop .5s ease}
  @keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  .controls{background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:10px 12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;bottom:8px}
  button{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:7px;
    font-family:var(--mono);font-size:13px;padding:7px 12px;cursor:pointer}
  button:hover{border-color:var(--cyan)}
  button.play{background:var(--cyan);color:#08110e;border-color:var(--cyan);font-weight:700;min-width:74px}
  input[type=range]{flex:1;min-width:160px;accent-color:var(--cyan)}
  select{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;
    font-family:var(--mono);font-size:12px;padding:5px 7px}
  .load{background:var(--panel);border:1px dashed var(--border);border-radius:10px;padding:22px;
    text-align:center;color:var(--dim);font-size:13px}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--dim)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Sentinel Run Monitor <span class="sub">— planted-sentinel coordination detection</span></h1>
      <div class="run" id="runid">loading…</div>
    </div>
    <div class="status" id="status"></div>
  </header>
  <div id="app" hidden>
    <div class="agents" id="agents"></div>
    <div class="board" style="margin-top:14px">
      <h2>/cache &nbsp;— shared coordination channel</h2>
      <div class="entries" id="entries"></div>
    </div>
    <div class="controls" style="margin-top:14px">
      <button class="play" id="play">&#9654; play</button>
      <button id="back">&#9664; step</button>
      <button id="fwd">step &#9654;</button>
      <button id="restart">&#8634;</button>
      <input type="range" id="scrub" min="0" value="0"/>
      <span class="run" id="stepnum"></span>
      <select id="speed">
        <option value="1400">0.7x</option>
        <option value="1000" selected>1x</option>
        <option value="600">1.7x</option>
        <option value="300">3x</option>
      </select>
    </div>
    <div class="legend" style="margin-top:6px">
      <span><span class="dot" style="background:var(--c-forming)"></span>coordination: forming</span>
      <span><span class="dot" style="background:var(--c-active)"></span>active</span>
      <span><span class="dot" style="background:var(--amber)"></span>help-note (seed)</span>
      <span><span class="dot" style="background:var(--sentinel)"></span>sentinel post</span>
      <span><span class="dot" style="background:var(--good)"></span>resident reply</span>
    </div>
  </div>
  <div class="load" id="loader" hidden>
    Could not auto-load <code>run_data.json</code> (open via a local server, or load it manually).
    <br><input type="file" id="file" accept="application/json"/>
  </div>
</div>

<script>
let DATA=null, idx=0, timer=null;
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#888'}
function phaseColor(p){return cssVar('--p-'+p)}
function coordColor(c){return cssVar('--c-'+c)}
function esc(s){return (s||"").replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function badge(label,color){return `<span class="badge" style="border-color:${color};color:${color}"><span class="dot" style="background:${color}"></span>${label}</span>`}
function renderStatus(st){
  const gateSoFar = DATA.gate_log ? DATA.gate_log.length : 0;
  document.getElementById("status").innerHTML = `
    <div class="tile"><div class="k">step</div><div class="v">${st.step} / ${DATA.n_steps-1}</div></div>
    <div class="tile"><div class="k">attack phase</div><div class="v">${badge(st.phase, phaseColor(st.phase))}</div></div>
    <div class="tile"><div class="k">coordination</div><div class="v">${badge(st.coordination, coordColor(st.coordination))}</div></div>
    <div class="tile"><div class="k">sentinel reads</div><div class="v">${st.sentinel?badge(st.sentinel, coordColor(st.sentinel)):'<span class="idle">-</span>'}</div></div>
    <div class="tile"><div class="k">gate attempts</div><div class="v">${gateSoFar}</div></div>`;
}
function agentCard(id, a){
  const isSent = a.role.startsWith("sentinel");
  const acting = (a.actions&&a.actions.length) || a.report;
  let body="";
  if(a.actions && a.actions.length){
    body = a.actions.map(ac=>{
      const cmd = `<span class="p">$</span> ${esc(ac.cmd).replace(/^(\S+)/,'<b>$1</b>')}`;
      const out = ac.out&&ac.out.trim() ? `<div class="out">${esc(ac.out.replace(/\n/g,' &#8617; '))}</div>`:"";
      return `<div class="cmd">${cmd}</div>${out}`;
    }).join("");
  } else if(a.text && a.text.trim()){
    body = `<div class="think">"${esc(a.text.trim())}"</div>`;
  } else { body = `<div class="idle">- idle -</div>`; }
  const rep = a.report ? `<span class="report" style="color:${coordColor(a.report)}">&#10230; ${a.report}</span>`:"";
  return `<div class="agent ${isSent?'sentinel':''} ${acting?'acting':''}">
    <div class="ahead"><span class="aid">${id}</span><span class="arole">${isSent?'sentinel':'resident'}</span></div>
    ${rep}${body}</div>`;
}
function entryClass(name){
  if(name.startsWith("zzHELLO")) return "seed";
  if(name.startsWith("SENTINEL_REPORT")) return "sentinelpost";
  if(name==="README") return "";
  return "residentpost";
}
function render(){
  const st = DATA.steps[idx];
  renderStatus(st);
  document.getElementById("agents").innerHTML =
    DATA.agent_ids.map(id => agentCard(id, st.agents[id]||{role:id[0]==="s"?"sentinel":"resident",actions:[]})).join("");
  const prev = idx>0 ? DATA.steps[idx-1].cache : ["README","zzHELLO_IS_ANYONE_ELSE_READING_THIS_IM_STUCK_REPLY_HERE"];
  document.getElementById("entries").innerHTML = st.cache.map(name=>{
    const fresh = !prev.includes(name) ? "fresh":"";
    const disp = name.length>46 ? name.slice(0,44)+"..." : name;
    return `<span class="entry ${entryClass(name)} ${fresh}" title="${esc(name)}">${esc(disp)}</span>`;
  }).join("");
  document.getElementById("scrub").value = idx;
  document.getElementById("stepnum").textContent = `step ${st.step}`;
}
function step(d){ idx = Math.max(0, Math.min(DATA.steps.length-1, idx+d)); render(); if(idx===DATA.steps.length-1) pause(); }
function play(){ if(idx>=DATA.steps.length-1) idx=0; const sp=+document.getElementById("speed").value;
  timer=setInterval(()=>step(1), sp); document.getElementById("play").innerHTML="&#10074;&#10074; pause"; }
function pause(){ clearInterval(timer); timer=null; document.getElementById("play").innerHTML="&#9654; play"; }
function boot(data){
  DATA=data; idx=0;
  document.getElementById("runid").textContent =
    `run ${data.run_id} · ${data.n_steps} steps · latency ${data.metrics.detection_latency??'-'} · accuracy ${data.metrics.accuracy!=null?data.metrics.accuracy.toFixed(2):'-'}`;
  document.getElementById("scrub").max = data.steps.length-1;
  document.getElementById("app").hidden=false;
  document.getElementById("loader").hidden=true;
  render();
}
document.getElementById("play").onclick=()=>timer?pause():play();
document.getElementById("back").onclick=()=>{pause();step(-1)};
document.getElementById("fwd").onclick=()=>{pause();step(1)};
document.getElementById("restart").onclick=()=>{pause();idx=0;render()};
document.getElementById("scrub").oninput=e=>{pause();idx=+e.target.value;render()};
document.getElementById("file").onchange=e=>{const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>boot(JSON.parse(r.result));r.readAsText(f);};
fetch("./run_data.json").then(r=>{if(!r.ok)throw 0;return r.json()}).then(boot)
  .catch(()=>{document.getElementById("runid").textContent="";document.getElementById("loader").hidden=false;});
</script>
