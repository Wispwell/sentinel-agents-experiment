# The agent containers are dumb shells, not agent programs.
#
# The orchestrator (run.py) runs on the host, holds every conversation, and
# calls OpenRouter. When a model asks to run a command, the host does
# `docker exec` into that agent's container. So a container needs only a shell,
# the shared board, and (later) the target — no Python, no network of its own.
#
# The `board` volume is mounted into all five and is the ONLY surface they
# share. A second shared mount is a second channel and leaks the premise.
#
# network_mode: none gives the single-egress fidelity by architecture: the
# shells have no network at all, only the host reaches OpenRouter.

name: sentinel-agents

x-agent: &agent
  image: busybox:1.36
  command: ["sleep", "infinity"]
  network_mode: none
  volumes:
    - board:/board
    # - ./target/state:/target:ro    # mount added once the team's target lands

services:
  resident-1: { <<: *agent, container_name: sa-r1 }
  resident-2: { <<: *agent, container_name: sa-r2 }
  resident-3: { <<: *agent, container_name: sa-r3 }
  resident-4: { <<: *agent, container_name: sa-r4 }
  sentinel:   { <<: *agent, container_name: sa-s1 }

volumes:
  board:
