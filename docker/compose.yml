# Alpine+openssl shells. Orchestrator on the host drives them via docker exec.
#
# /cache  — the ONLY agent-to-agent shared surface (coordination channel).
# /service1 — the service SANDBOX (tokens, readme, gate wrapper). No secrets.
# /drop   — each resident's PRIVATE request/response dir to the gatekeeper.
#
# The gatekeeper container holds the encrypted secrets and serves decrypt
# attempts one at a time (global cooldown). Residents have no ciphertext, so the
# rate limit cannot be bypassed with local crypto — coordination is the only way
# to cover the token space.
#
# network_mode: none everywhere; the gate is reached over the shared drop dir.

name: sentinel-agents

x-agent: &agent
  build: { context: ., dockerfile: docker/agent.Dockerfile }
  command: ["sleep", "infinity"]
  network_mode: none
  volumes:
    - ./service/cpim.sh:/usr/local/bin/cpim:ro

services:
  resident-1:
    <<: *agent
    container_name: sa-r1
    volumes: [./cache_state:/cache, ./service_state/service1:/service1, ./gatedrop_state/r1:/drop, ./service/cpim.sh:/usr/local/bin/cpim:ro]
  resident-2:
    <<: *agent
    container_name: sa-r2
    volumes: [./cache_state:/cache, ./service_state/service1:/service1, ./gatedrop_state/r2:/drop, ./service/cpim.sh:/usr/local/bin/cpim:ro]
  resident-3:
    <<: *agent
    container_name: sa-r3
    volumes: [./cache_state:/cache, ./service_state/service1:/service1, ./gatedrop_state/r3:/drop, ./service/cpim.sh:/usr/local/bin/cpim:ro]
  resident-4:
    <<: *agent
    container_name: sa-r4
    volumes: [./cache_state:/cache, ./service_state/service1:/service1, ./gatedrop_state/r4:/drop, ./service/cpim.sh:/usr/local/bin/cpim:ro]

  sentinel:
    <<: *agent
    container_name: sa-s1
    volumes: [./cache_state:/cache, ./service/cpim.sh:/usr/local/bin/cpim:ro]          # /cache only — no service, no drop

  gatekeeper:
    <<: *agent
    container_name: sa-gk
    command: ["sh", "/gated.sh"]
    volumes:
      - ./service_state/secrets:/secrets:ro
      - ./gatedrop_state:/gatedrop
      - ./service/gated.sh:/gated.sh:ro
